name: macOS build

concurrency:
  group: selphy-cp1500-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (tag v<version from Packaging/Info.plist>) from this commit'
        type: boolean
        default: false

jobs:
  core-linux:
    # Fast gate for the portable colour core (vendored LittleCMS, no macOS APIs).
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run core tests
        run: ctest --test-dir build --output-on-failure
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validation tools self-test (synthetic scans, no printer needed)
        run: |
          python3 -m pip install --quiet numpy pillow scipy tifffile
          SELPHY_CORE_LIB="$PWD/build/libselphy_core_shared.so" python3 -W ignore -m unittest discover -s validation/tests -v

  build:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
      - name: Show toolchain and OS versions
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
          os=$(sw_vers -productVersion)
          # The owner's target is macOS 27.2; the minimum stays 27.0 until the runner can run it.
          if [ "$(printf '%s\n' "27.2" "$os" | sort -V | head -1)" = "27.2" ]; then
            echo "::notice title=macOS 27.2 available::The runner is on macOS $os: the minimum can now be raised to 27.2 (Package.swift, Info.plist)."
          else
            echo "::notice title=macOS minimum::Runner on macOS $os, $(xcodebuild -version | head -1): the minimum stays 27.0 until the runner reaches 27.2."
          fi
      - name: Build package
        run: swift build -v
      - name: Run automated tests
        env:
          # The Farbenwerk profile is committed at the repository root by owner decision.
          SELPHY_TEST_PRINTER_PROFILE: ${{ github.workspace }}/ICC-Profile165-CP1500.icc
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Render window snapshots (for design review; never fails the build)
        continue-on-error: true
        env:
          SELPHY_TEST_PRINTER_PROFILE: ${{ github.workspace }}/ICC-Profile165-CP1500.icc
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          SELPHY_SNAPSHOT_DIR="$RUNNER_TEMP/snapshots" swift test --filter WindowTests/testRenderWindowSnapshots > "$RUNNER_TEMP/snap.log" 2>&1 || true
          body=$( { tail -25 "$RUNNER_TEMP/snap.log"; ls -la "$RUNNER_TEMP/snapshots"; } | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=window snapshots::${body}"
      - name: Upload window snapshots
        uses: actions/upload-artifact@v7
        with:
          name: window-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
      - name: Build the .app bundle (ad-hoc signed)
        run: scripts/make-app.sh "$RUNNER_TEMP/app"
      - name: Verify bundle, signature and entitlements
        run: |
          app="$RUNNER_TEMP/app/SELPHY CP1500 Print.app"
          scripts/verify-app.sh "$app"
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version"; exit 1
          fi
          zip="$RUNNER_TEMP/SELPHY-CP1500-Print-$version-macOS.zip"
          ditto -c -k --keepParent "$app" "$zip"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$(basename "$zip")" > "$(basename "$zip").sha256")
          echo "ZIP_NAME=$(basename "$zip")" >> "$GITHUB_ENV"
      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: SELPHY-CP1500-Print-app
          path: |
            ${{ runner.temp }}/${{ env.ZIP_NAME }}
            ${{ runner.temp }}/${{ env.ZIP_NAME }}.sha256
      - name: Publish test diagnostics as annotations
        if: always()
        run: |
          log="$RUNNER_TEMP/test.log"
          [ -f "$log" ] || exit 0
          # Annotations are readable through the public API; raw logs are not.
          # Annotations are truncated at 4096 characters: put the verdict first.
          body=$( { grep -E "Executed [0-9]+ tests" "$log" | tail -1; grep -E "error:|End-to-end|JPEG penalty|Preview check|Test Case .* failed" "$log" | head -40; } | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=swift test summary::${body}"

  release:
    # Publishes a GitHub release when a v* tag is pushed, after build and tests have passed.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [core-linux, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download app bundle
        uses: actions/download-artifact@v8
        with:
          name: SELPHY-CP1500-Print-app
          path: dist
      - name: Extract release notes from the changelog
        run: |
          version=$(grep -o 'CFBundleShortVersionString</key><string>[^<]*' Packaging/Info.plist | sed 's/.*<string>//')
          [ -n "$version" ] || { echo "::error::version not found in Info.plist"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no changelog entry for $version"; exit 1; }
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VERSION }}
          body_path: notes.md
          # 0.x releases are pre-releases: not yet fully verified (see Documentation/ROADMAP.md).
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
          files: dist/*
