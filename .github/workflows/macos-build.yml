name: macOS build

concurrency:
  group: selphy-cp1500-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-linux:
    # Fast gate for the portable colour core (vendored LittleCMS, no macOS APIs).
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run core tests
        run: ctest --test-dir build --output-on-failure

  build:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show toolchain and OS versions
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
      - name: Build package
        run: swift build -v
      - name: Run automated tests
        env:
          # The Farbenwerk profile is committed at the repository root by owner decision.
          SELPHY_TEST_PRINTER_PROFILE: ${{ github.workspace }}/ICC-Profile165-CP1500.icc
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Publish test diagnostics as annotations
        if: always()
        run: |
          log="$RUNNER_TEMP/test.log"
          [ -f "$log" ] || exit 0
          # Annotations are readable through the public API; raw logs are not.
          # Annotations are truncated at 4096 characters: put the verdict first.
          body=$( { grep -E "Executed [0-9]+ tests" "$log" | tail -1; grep -E "error:|End-to-end|JPEG penalty|Preview check|Test Case .* failed" "$log" | head -40; } | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=swift test summary::${body}"
