name: macOS build

concurrency:
  group: selphy-cp1500-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Install LittleCMS test dependency
        run: brew install little-cms2 pkgconf
      - name: Build package
        run: swift build -v
      - name: Run automated tests
        env:
          # The Farbenwerk profile is committed at the repository root by owner decision.
          SELPHY_TEST_PRINTER_PROFILE: ${{ github.workspace }}/ICC-Profile165-CP1500.icc
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Publish test diagnostics as annotations
        if: always()
        run: |
          log="$RUNNER_TEMP/test.log"
          [ -f "$log" ] || exit 0
          # Annotations are readable through the public API; raw logs are not.
          body=$(grep -E "ICC numeric comparison|LCMS|error:|Executed [0-9]+ tests|Test Case .* failed" "$log" | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=swift test summary::${body}"
